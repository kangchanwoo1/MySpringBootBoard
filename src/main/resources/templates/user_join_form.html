<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 500px;
            margin-top: 50px;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: bold;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-group .btn {
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>회원가입</h1>

    <!-- errorMessage가 있다면 출력 -->
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- action: 폼 제출 시 POST /user/join으로 보냄 -->
    <!-- object: 폼 필드들을 user 객체와 바인딩함 -->
    <form th:action="@{/user/join}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" th:field="*{username}" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" th:field="*{password}" id="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" th:field="*{email}" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="phoneNumber" class="form-label">핸드폰 번호</label>
            <input type="tel" th:field="*{phoneNumber}" id="phoneNumber" class="form-control" placeholder="010-xxxx-xxxx" required pattern="010-\d{4}-\d{4}">
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg">회원가입</button>
        </div>
    </form>

    <div class="btn-group mt-3">
        <a href="/board/list" class="btn btn-secondary">메인으로</a>
        <a href="/user/login" class="btn btn-info">로그인</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
