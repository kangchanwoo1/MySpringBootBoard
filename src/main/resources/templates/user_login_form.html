<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 400px;
            margin-top: 50px;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: bold;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-group .btn {
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>로그인</h1>

    <!-- 💡💡💡 로그인 실패 메시지 출력 (URL에 ?error=true가 있을 때) 💡💡💡 -->
    <div th:if="${param.error}" class="error-message">
        <p>아이디 또는 비밀번호가 올바르지 않습니다.</p>
    </div>

    <!-- 💡💡💡 로그아웃 성공 메시지 출력 (URL에 ?logout=true가 있을 때) 💡💡💡 -->
    <div th:if="${param.logout}" class="alert alert-info text-center" role="alert">
        성공적으로 로그아웃 되었습니다.
    </div>

    <!-- 💡💡💡 폼의 action을 "/user/doLogin"으로 변경 💡💡💡 -->
    <form th:action="@{/user/doLogin}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-success btn-lg">로그인</button>
        </div>
    </form>

    <div class="btn-group mt-3">
        <a href="/board/list" class="btn btn-secondary">메인으로</a>
        <a href="/user/join" class="btn btn-primary">회원가입</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
